{% extends 'layout.html' %}
{% block body %}
<div class="max-w-lg mx-auto bg-white p-8 rounded-lg shadow-md">
    <h1 class="text-2xl font-bold mb-6">Apnar Profile</h1>
    <form method="POST" action="{{ url_for('profile') }}">
        <div class="mb-4">
            <label for="fullname" class="block text-gray-700 font-medium mb-2">Puro Naam</label>
            <input type="text" name="fullname" id="fullname" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" value="{{ user.fullname }}" required>
        </div>
        <div class="mb-4">
            <label for="email" class="block text-gray-700 font-medium mb-2">Email Address</label>
            <input type="email" name="email" id="email" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" value="{{ user.email }}" required>
        </div>
        <div class="mb-4">
            <p class="text-gray-600"><span class="font-medium">Account Role:</span> {{ user.role|capitalize }}</p>
            <p class="text-gray-600"><span class="font-medium">Member Since:</span> {{ user.created_at.strftime('%d %B, %Y') }}</p>
        </div>
        <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 font-semibold">Update Profile</button>
    </form>
</div>
{% endblock %}
