{% extends 'layout.html' %}
{% block body %}
<h1 class="text-4xl font-bold mb-8">Add a New Event</h1>
<div class="max-w-2xl mx-auto bg-white p-8 rounded-xl shadow-lg">
    <form method="POST" action="{{ url_for('add_event') }}">
        <div class="mb-4">
            <label for="name" class="block text-gray-700 font-medium mb-2">Event Name</label>
            <input type="text" name="name" class="w-full p-3 border rounded-lg" required>
        </div>
        <div class="mb-4">
            <label for="description" class="block text-gray-700 font-medium mb-2">Description</label>
            <textarea name="description" rows="4" class="w-full p-3 border rounded-lg" required></textarea>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
            <div>
                <label for="start_time" class="block text-gray-700 font-medium mb-2">Start Time</label>
                <input type="datetime-local" name="start_time" class="w-full p-3 border rounded-lg" required>
            </div>
            <div>
                <label for="end_time" class="block text-gray-700 font-medium mb-2">End Time</label>
                <input type="datetime-local" name="end_time" class="w-full p-3 border rounded-lg" required>
            </div>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
            <div>
                <label for="venue_id" class="block text-gray-700 font-medium mb-2">Venue</label>
                <select name="venue_id" class="w-full p-3 border rounded-lg">
                    {% for venue in venues %}
                    <option value="{{ venue.id }}">{{ venue.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label for="category_id" class="block text-gray-700 font-medium mb-2">Category</label>
                <select name="category_id" class="w-full p-3 border rounded-lg">
                    {% for category in categories %}
                    <option value="{{ category.id }}">{{ category.name }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>
         <div class="mb-6">
            <label for="image_url" class="block text-gray-700 font-medium mb-2">Image URL (Optional)</label>
            <input type="text" name="image_url" class="w-full p-3 border rounded-lg">
        </div>
        <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-lg hover:bg-blue-700 font-bold text-lg">Create Event</button>
    </form>
</div>
{% endblock %}
