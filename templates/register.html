{% extends 'layout.html' %}
{% block body %}
<div class="max-w-md mx-auto bg-white p-8 rounded-lg shadow-md">
    <h1 class="text-2xl font-bold mb-6 text-center">Create an Account</h1>
    <form method="POST" action="{{ url_for('register') }}">
        <div class="mb-4">
            <label for="fullname" class="block text-gray-700 font-medium mb-2">Full Name</label>
            <input type="text" name="fullname" id="fullname" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" required>
        </div>
        <div class="mb-4">
            <label for="email" class="block text-gray-700 font-medium mb-2">Email Address</label>
            <input type="email" name="email" id="email" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" required>
        </div>
        <div class="mb-6">
            <label for="password" class="block text-gray-700 font-medium mb-2">Password</label>
            <input type="password" name="password" id="password" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" required>
        </div>
        <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 font-semibold">Register</button>
    </form>
    <p class="text-center mt-4 text-gray-600">
        Already have an account? <a href="{{ url_for('login') }}" class="text-blue-600 hover:underline">Login</a>
    </p>
</div>
{% endblock %}
